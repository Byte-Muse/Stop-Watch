<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furina Stop Watch</title>
    <link rel="stylesheet" href="Stop Watch.css">
</head>
<body>
    <div class="stopwatch">
        <h1 id="clock">00:00:00</h1>
        <div class="buttons">
            <img id="btn" src="images/furina_start-removebg-preview.png" alt="start" onclick="watchStart()" style="width: 150px;">
            <img id="btn" src="images/furina_stop-removebg-preview (1).png" alt="stop" style="width: 150px;">
            <img id="btn" src="images/furina_restart-removebg-preview.png" alt="reset" style="width: 150px;">
        </div>

    </div>
    
    <link rel="module" href="Stop Watch.js">
</body>
</html>
