<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furina Stop Watch</title>
    <link rel="stylesheet" href="Stop Watch.css">
</head>
<body>
    <div class="stopwatch">
        <h1 id="clock">00:00:00</h1>
        <div class="buttons">
            <img  src="images/furina_stop-removebg-preview (1).png" alt="stop" style="width: 140px;">
            <img  src="images/furina_start-removebg-preview.png" alt="start" onclick="watchStart()" style="width: 180px;">
            <img  src="images/furina_restart-removebg-preview.png" alt="reset" style="width: 140px;">
        </div>

    </div>

    <script src="Stop Watch.js"></script>
    
</body>
</html>
