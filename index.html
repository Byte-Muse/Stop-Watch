<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furina Stop Watch</title>
    <link rel="stylesheet" href="Stop Watch.css">
</head>
<body>
    <div class="stopwatch">
        <h1 id="clock">00 : 00 : 00</h1>
        <div class="buttons">
            <div class="holographic-btn" onclick="watchStop()"><img  src="images/furina_stop-removebg-preview (1).png" alt="stop" style="width: 60px;" > <p>Stop</p> </div>
            <div class="holographic-btn" onclick="watchStart()"><img  src="images/furina_start-removebg-preview.png" alt="start"  style="width: 80px;"> <p>Start</p> </div>
            <div class="holographic-btn" onclick="watchReset()"><img  src="images/furina_restart-removebg-preview.png" alt="reset" style="width: 60px;" > <p>Reset</p> </div>
        </div>

    </div>

    <script src="Stop Watch.js"></script>
    
</body>
</html>
